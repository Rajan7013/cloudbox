<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CloudBox – File Manager Prototype</title>
<style>
:root{--bg:#F5F6FB;--card:#fff;--tx:#161B2E;--mu:#6B7190;--pr:#4F46E5;--pr2:#EEF0FF;--bd:#E7E9F4;--sh:0 6px 20px rgba(60,60,120,.09);--out:#E4E6F2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1020;--card:#1A1D33;--tx:#EEF0FF;--mu:#9296B5;--pr:#7C83FF;--pr2:#24284A;--bd:#2A2E4F;--sh:0 6px 20px rgba(0,0,0,.4);--out:#05060F}}
:root[data-theme="dark"]{--bg:#0E1020;--card:#1A1D33;--tx:#EEF0FF;--mu:#9296B5;--pr:#7C83FF;--pr2:#24284A;--bd:#2A2E4F;--sh:0 6px 20px rgba(0,0,0,.4);--out:#05060F}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--out);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tx);display:flex;align-items:center;justify-content:center}
#app{position:relative;width:390px;height:min(844px,100%);background:var(--bg);border-radius:32px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 60px rgba(0,0,0,.35)}
@media(max-width:430px){#app{width:100%;height:100%;border-radius:0}}
#screen{flex:1;overflow-y:auto;padding:16px 18px 96px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit;color:var(--tx)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.top h1{font-size:22px;font-weight:700;flex:1}
.av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,#6366F1,#EC4899);color:#fff;font-weight:700;display:grid;place-items:center}
.ib{width:40px;height:40px;border-radius:12px;background:var(--card);box-shadow:var(--sh);display:grid;place-items:center;font-size:17px}
.search{display:flex;gap:8px;align-items:center;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--sh);color:var(--mu);margin-bottom:14px;width:100%}
.search input{flex:1;border:0;background:none;outline:0}
.sec{display:flex;justify-content:space-between;align-items:center;margin:18px 0 10px;font-weight:700}
.sec small{color:var(--pr);font-weight:600;font-size:13px}
.hero{background:linear-gradient(135deg,#4F46E5,#8B5CF6);color:#fff;border-radius:22px;padding:18px;box-shadow:var(--sh)}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:9px;overflow:hidden;margin:10px 0 6px}
.bar i{display:block;height:100%;background:#fff;border-radius:9px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;padding:8px 14px;border-radius:20px;background:var(--card);box-shadow:var(--sh);font-size:13px;font-weight:600}
.chip.on{background:var(--pr);color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--sh);position:relative;text-align:left}
.th{height:74px;border-radius:12px;display:grid;place-items:center;font-size:32px;margin-bottom:10px}
.nm{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mt{font-size:12px;color:var(--mu);margin-top:2px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:16px;padding:10px 12px;box-shadow:var(--sh);margin-bottom:10px;width:100%;text-align:left}
.row .th{width:44px;height:44px;margin:0;font-size:22px;flex:none}
.row .in{flex:1;min-width:0}
.dots{padding:6px 8px;color:var(--mu);font-weight:700;font-size:18px}
.crumb{display:flex;gap:6px;align-items:center;font-size:13px;color:var(--mu);margin-bottom:12px;flex-wrap:wrap}
.crumb b{color:var(--pr);cursor:pointer}
.tabs{position:absolute;left:0;right:0;bottom:0;background:var(--card);display:flex;justify-content:space-around;padding:10px 6px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--bd)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--mu);width:64px}
.tab span{font-size:20px}.tab.on{color:var(--pr);font-weight:700}
.fab{position:absolute;right:20px;bottom:88px;width:58px;height:58px;border-radius:20px;background:var(--pr);color:#fff;font-size:30px;box-shadow:0 10px 24px rgba(79,70,229,.5);display:grid;place-items:center}
.ov{position:absolute;inset:0;background:rgba(10,12,30,.5);display:flex;align-items:flex-end;z-index:20}
.sheet{background:var(--card);width:100%;border-radius:26px 26px 0 0;padding:10px 18px 26px;max-height:85%;overflow-y:auto;animation:up .22s ease}
@keyframes up{from{transform:translateY(60%);opacity:.4}}
.grab{width:42px;height:5px;border-radius:5px;background:var(--bd);margin:0 auto 14px}
.sheet h3{margin-bottom:12px}
.act{display:flex;align-items:center;gap:14px;padding:12px 4px;width:100%;text-align:left;font-weight:500;border-radius:12px}
.act:active{background:var(--pr2)}
.act span{width:36px;height:36px;border-radius:12px;background:var(--pr2);display:grid;place-items:center}
.btn{background:var(--pr);color:#fff;padding:13px;border-radius:14px;font-weight:700;width:100%;margin-top:10px}
.btn.g{background:var(--pr2);color:var(--pr)}
.fld{width:100%;border:1.5px solid var(--bd);background:var(--bg);border-radius:14px;padding:12px;outline:0}
select{background:var(--pr2);color:var(--pr);border:0;border-radius:10px;padding:6px 8px;font-weight:600}
.tg{width:46px;height:26px;border-radius:20px;background:var(--bd);position:relative;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.2s}
.tg.on{background:var(--pr)}.tg.on i{left:23px}
.toast{position:absolute;left:18px;right:18px;bottom:96px;background:#1c2040;color:#fff;border-radius:16px;padding:12px 14px;z-index:30;font-size:14px;box-shadow:var(--sh)}
.toast .bar{background:rgba(255,255,255,.2);margin:8px 0 0}
.login{display:flex;flex-direction:column;justify-content:center;min-height:100%;text-align:center;gap:14px}
.logo{width:92px;height:92px;border-radius:28px;margin:0 auto;background:linear-gradient(135deg,#4F46E5,#EC4899);display:grid;place-items:center;font-size:44px;box-shadow:0 14px 34px rgba(79,70,229,.45)}
.dotsw{display:flex;gap:6px;justify-content:center}.dotsw i{width:8px;height:8px;border-radius:8px;background:var(--bd)}.dotsw i.on{width:24px;background:var(--pr)}
.view{height:300px;border-radius:22px;display:grid;place-items:center;font-size:90px;margin-bottom:16px;position:relative;overflow:hidden}
.play{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.9);color:#4F46E5;font-size:28px;display:grid;place-items:center}
.wave{display:flex;align-items:center;gap:4px;height:90px}.wave i{width:6px;border-radius:6px;background:#fff}
.lines i{display:block;height:9px;border-radius:6px;background:rgba(255,255,255,.7);margin:10px 0}
.empty{text-align:center;color:var(--mu);padding:40px 0}
.pp{display:flex;align-items:center;gap:12px;padding:8px 0}
.pp .av{width:36px;height:36px;font-size:14px}
.seg{display:flex;background:var(--card);border-radius:14px;padding:4px;margin-bottom:12px;box-shadow:var(--sh)}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:13px;color:var(--mu)}
.seg .on{background:var(--pr);color:#fff}
.rb{font-size:11px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--pr2);color:var(--pr);flex:none}
.nd{width:8px;height:8px;border-radius:50%;background:#EF4444;flex:none}
.tbar{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px}
.tb{flex:none;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:600;padding:10px 8px;border-radius:14px;background:var(--card);box-shadow:var(--sh)}
.tb span{font-size:18px}.tb.on{background:var(--pr);color:#fff}
.paper{border-radius:16px;padding:20px;line-height:1.6;box-shadow:var(--sh);min-height:300px;margin-bottom:12px;transition:.2s}
.paper p{margin:10px 0}
mark{background:#FDE047;color:#000;border-radius:3px}
.pn{display:flex;gap:10px;align-items:center;margin-bottom:12px;accent-color:var(--pr)}
.ctl{margin-bottom:12px;accent-color:var(--pr)}
.cap{position:absolute;bottom:16px;background:#000a;color:#fff;padding:4px 10px;border-radius:8px;font-size:13px}
.tbl{border-collapse:collapse;font-size:13px;min-width:100%}
.tbl td,.tbl th{border:1px solid var(--bd);padding:8px 10px;white-space:nowrap}
.tbl th{background:var(--pr2);color:var(--pr)}
.tbl td.sel{outline:2px solid var(--pr);outline-offset:-2px;background:var(--pr2)}
.lab{font-size:12px;font-weight:700;color:var(--mu);letter-spacing:.5px;margin:18px 0 8px}
</style></head>
<body><div id="app"><div id="screen"></div><div id="nav"></div><div id="layer"></div></div>
<script>
const TY={folder:['📁','#F59E0B'],doc:['📄','#3B82F6'],sheet:['📊','#10B981'],pdf:['📕','#EF4444'],img:['🖼️','#EC4899'],video:['🎬','#8B5CF6'],audio:['🎵','#14B8A6'],zip:['🗜️','#64748B']};
const NAMES={folder:'Folders',doc:'Documents',sheet:'Sheets',pdf:'PDFs',img:'Images',video:'Videos',audio:'Audio',zip:'Archives'};
let uid=20;
let items=[
{id:1,p:0,n:'Work',t:'folder',s:0,d:5},{id:2,p:0,n:'Photos',t:'folder',s:0,d:3,sh:1},{id:3,p:0,n:'Study',t:'folder',s:0,d:9},
{id:4,p:0,n:'Resume.pdf',t:'pdf',s:420,d:1,star:1},{id:5,p:0,n:'Budget 2026.xlsx',t:'sheet',s:310,d:2,sh:1},
{id:6,p:0,n:'Trip video.mp4',t:'video',s:84000,d:4},{id:7,p:0,n:'Podcast ep1.mp3',t:'audio',s:9200,d:6},{id:8,p:0,n:'Notes.docx',t:'doc',s:55,d:0,star:1},
{id:9,p:1,n:'Projects',t:'folder',s:0,d:7},{id:10,p:1,n:'Proposal.docx',t:'doc',s:120,d:2},{id:11,p:1,n:'Invoice.pdf',t:'pdf',s:210,d:3},
{id:12,p:9,n:'App design.pdf',t:'pdf',s:1800,d:1},{id:13,p:9,n:'Backup.zip',t:'zip',s:52000,d:8},
{id:14,p:2,n:'Beach.jpg',t:'img',s:3400,d:3},{id:15,p:2,n:'Sunset.png',t:'img',s:2800,d:5},{id:16,p:3,n:'Physics notes.pdf',t:'pdf',s:900,d:10}];
const ST={v:'login',tab:'home',cwd:0,mode:'grid',sk:'d',dir:1,ft:'all',q:'',sel:null,onb:0,dark:null,wifi:true,off:{}};
const $=s=>document.querySelector(s);
const sz=k=>k?(k>=1024?(k/1024).toFixed(1)+' MB':k+' KB'):'';
const ago=d=>d==0?'Today':d==1?'Yesterday':d+' days ago';
const get=id=>items.find(i=>i.id==id);
function list(f){let a=items.filter(i=>!i.tr&&f(i));if(ST.ft!='all')a=a.filter(i=>i.t==ST.ft);
 a.sort((x,y)=>{if((x.t=='folder')!=(y.t=='folder'))return x.t=='folder'?-1:1;let r=ST.sk=='n'?x.n.localeCompare(y.n):ST.sk=='s'?x.s-y.s:ST.sk=='t'?x.t.localeCompare(y.t):y.d-x.d;return r*ST.dir});return a}
function th(i){const[e,c]=TY[i.t];return `<div class="th" style="background:${c}22">${e}</div>`}
function meta(i){return [i.t=='folder'?'':sz(i.s),ago(i.d)].filter(Boolean).join(' · ')+(i.sh?' · 👥':'')}
function item(i){const star=i.star?'⭐ ':'';
 if(ST.mode=='list')return `<div class="row" onclick="op(${i.id})">${th(i)}<div class="in"><div class="nm">${star}${i.n}</div><div class="mt">${meta(i)}</div></div><button class="dots" onclick="event.stopPropagation();act(${i.id})">⋮</button></div>`;
 return `<div class="card" onclick="op(${i.id})">${th(i)}<div class="nm">${star}${i.n}</div><div class="mt">${meta(i)}</div><button class="dots" style="position:absolute;top:4px;right:2px" onclick="event.stopPropagation();act(${i.id})">⋮</button></div>`}
function wrap(a){return a.length?`<div class="${ST.mode=='grid'?'grid':''}">${a.map(item).join('')}</div>`:`<div class="empty"><div style="font-size:48px">🗂️</div>Nothing here yet</div>`}
function ctrl(){return `<div style="display:flex;gap:8px;margin-bottom:12px"><button class="chip" style="flex:1" onclick="sheet('sort')">⇅ Sort &amp; filter${ST.ft!='all'?' •':''}</button><button class="chip" onclick="ST.mode=ST.mode=='grid'?'list':'grid';go()">${ST.mode=='grid'?'☰ List':'▦ Grid'}</button></div>`}
function crumbs(){let p=[],c=ST.cwd;while(c){p.unshift(get(c));c=get(c).p}
 return `<div class="crumb"><b onclick="ST.cwd=0;go()">My Files</b>${p.map(x=>` › <b onclick="ST.cwd=${x.id};go()">${x.n}</b>`).join('')}</div>`}
function topbar(t){return `<div class="top"><h1>${t}</h1><button class="ib" onclick="ST.v='search';go()">🔍</button><button class="av" onclick="ST.v='settings';go()">A</button></div>`}
const V={
login(){const o=[['☁️','Store everything','Documents, photos, video and audio, all in your Google Drive.'],['🤝','Share with control','Invite people as Viewer, Commenter or Editor.'],['⚡','Find it fast','Search, sort and filter in one tap.']][ST.onb];
 return `<div class="login"><div class="logo">${o[0]}</div><h1 style="font-size:26px">${o[1]}</h1><p style="color:var(--mu);padding:0 12px">${o[2]}</p><div class="dotsw">${[0,1,2].map(i=>`<i class="${i==ST.onb?'on':''}"></i>`).join('')}</div>
 ${ST.onb<2?`<button class="btn" onclick="ST.onb++;go()">Next</button>`:`<button class="btn" onclick="ST.v='main';go()">G&nbsp; Continue with Google</button><p class="mt">Files are saved in your Google Drive</p>`}
 ${ST.onb<2?`<button class="mt" onclick="ST.onb=2;go()">Skip</button>`:''}</div>`},
home(){const used=Math.round(items.reduce((a,i)=>a+i.s,0)/1024);const rec=list(i=>i.t!='folder').sort((a,b)=>a.d-b.d).slice(0,4);
 return topbar('Hello, Alex 👋')+`<button class="search" onclick="ST.v='search';go()">🔍 <span>Search in CloudBox</span></button>
 <div class="hero"><div style="opacity:.85;font-size:13px">Google Drive storage</div><div style="font-size:26px;font-weight:700">${used} MB <span style="font-size:14px;opacity:.8">of 15 GB</span></div><div class="bar"><i style="width:${Math.max(4,used/150)}%"></i></div><div style="font-size:12px;opacity:.85;display:flex;justify-content:space-between"><span>Docs · Images · Video</span><button style="color:#fff;font-weight:700" onclick="ST.v='storage';go()">Details ›</button></div></div>
 <div class="sec">Quick access</div><div class="chips">${['img','video','audio','pdf','doc','zip'].map(t=>`<button class="chip" onclick="ST.ft='${t}';ST.tab='files';ST.cwd=0;go()">${TY[t][0]} ${NAMES[t]}</button>`).join('')}</div>
 <div class="sec">Recent <small onclick="ST.tab='files';go()">See all</small></div>${wrap(rec)}`},
files(){return topbar('My Files')+crumbs()+ctrl()+wrap(list(i=>i.p==ST.cwd))},
shared(){return topbar('Shared')+`<div class="chips" style="margin-bottom:12px"><span class="chip on">Shared by me</span><span class="chip">Shared with me</span></div>`+wrap(list(i=>i.sh))+`<div class="sec">Shared with me</div><div class="row"><div class="th" style="background:#3B82F622">📄</div><div class="in"><div class="nm">Team plan.docx</div><div class="mt">Riya shared · Editor</div></div></div><div class="row"><div class="th" style="background:#EC489922">🖼️</div><div class="in"><div class="nm">Brand kit.png</div><div class="mt">Sam shared · Viewer</div></div></div>`},
starred(){return topbar('Starred')+ctrl()+wrap(list(i=>i.star))},
search(){const q=ST.q.toLowerCase();const r=q||ST.ft!='all'?list(i=>i.n.toLowerCase().includes(q)):[];
 return `<div class="top"><button class="ib" onclick="ST.v='main';ST.ft='all';ST.q='';go()">←</button><div class="search" style="margin:0"><span>🔍</span><input id="qi" placeholder="Search files and folders" value="${ST.q}" oninput="ST.q=this.value;sr()"></div></div>
 <div class="chips" style="margin-bottom:12px">${['all','doc','pdf','img','video','audio','folder'].map(t=>`<button class="chip ${ST.ft==t?'on':''}" onclick="ST.ft='${t}';go(1)">${t=='all'?'All':NAMES[t]}</button>`).join('')}</div>
 <div id="res">${q||ST.ft!='all'?wrap(r):`<div class="sec">Recent searches</div>${['invoice','budget','photos'].map(x=>`<button class="row" onclick="ST.q='${x}';go(1)">🕘 ${x}</button>`).join('')}`}</div>`},
trash(){const a=items.filter(i=>i.tr);return `<div class="top"><button class="ib" onclick="ST.v='settings';go()">←</button><h1>Trash</h1></div><p class="mt" style="margin-bottom:12px">Items are deleted forever after 30 days.</p>`+(a.length?a.map(i=>`<div class="row">${th(i)}<div class="in"><div class="nm">${i.n}</div><div class="mt">${meta(i)}</div></div><button class="chip" onclick="get(${i.id}).tr=0;go()">Restore</button><button class="dots" onclick="items=items.filter(x=>x.id!=${i.id});go()">🗑</button></div>`).join('')+`<button class="btn g" onclick="items=items.filter(i=>!i.tr);go()">Empty trash</button>`:`<div class="empty"><div style="font-size:48px">🗑️</div>Trash is empty</div>`)},
storage(){const tot=items.reduce((a,i)=>a+i.s,0)||1;const by={};items.forEach(i=>by[i.t]=(by[i.t]||0)+i.s);
 return `<div class="top"><button class="ib" onclick="ST.v='main';go()">←</button><h1>Storage</h1></div><div class="hero"><div style="font-size:30px;font-weight:700">${Math.round(tot/1024)} MB</div><div style="opacity:.85">used of 15 GB</div></div><div class="sec">By type</div>`+Object.keys(by).filter(k=>by[k]).sort((a,b)=>by[b]-by[a]).map(k=>`<div class="row"><div class="th" style="background:${TY[k][1]}22">${TY[k][0]}</div><div class="in"><div class="nm">${NAMES[k]}</div><div style="height:6px;border-radius:6px;background:var(--bd);margin-top:6px"><i style="display:block;height:100%;border-radius:6px;width:${by[k]/tot*100}%;background:${TY[k][1]}"></i></div></div><div class="mt">${sz(by[k])}</div></div>`).join('')},
settings(){const dk=ST.dark===null?matchMedia('(prefers-color-scheme:dark)').matches:ST.dark;
 const tg=(l,on,f)=>`<div class="row" onclick="${f}"><div class="in nm">${l}</div><div class="tg ${on?'on':''}"><i></i></div></div>`;
 return `<div class="top"><button class="ib" onclick="ST.v='main';go()">←</button><h1>Settings</h1></div><div class="row"><div class="av" style="width:54px;height:54px;font-size:22px">A</div><div class="in"><div class="nm">Alex Kumar</div><div class="mt">alex@gmail.com · Google Drive linked</div></div></div>
 <div class="sec">Preferences</div>${tg('Dark mode',dk,"ST.dark=!"+dk+";document.documentElement.dataset.theme=ST.dark?'dark':'light';go()")}${tg('Upload on Wi-Fi only',ST.wifi,'ST.wifi=!ST.wifi;go()')}${tg('Grid view by default',ST.mode=='grid',"ST.mode=ST.mode=='grid'?'list':'grid';go()")}
 <div class="sec">More</div><button class="row" onclick="ST.v='trash';go()">🗑️ <span class="in nm">Trash</span> ›</button><button class="row" onclick="ST.v='storage';go()">💾 <span class="in nm">Storage</span> ›</button><button class="row" onclick="ST.tab='files';ST.ft='all';ST.v='main';go();toast('Offline: '+Object.keys(ST.off).length+' files saved')">📶 <span class="in nm">Offline files</span> ›</button><button class="row" onclick="ST.v='login';ST.onb=0;go()">🚪 <span class="in nm">Sign out</span></button>`},
viewer(){const i=get(ST.sel);const c=TY[i.t][1];let body='';
 if(i.t=='img')body=`<div class="view" style="background:linear-gradient(160deg,#fbc2eb,#a6c1ee)">🏞️</div>`;
 else if(i.t=='video')body=`<div class="view" style="background:#111"><div class="play">▶</div></div>`;
 else if(i.t=='audio')body=`<div class="view" style="background:linear-gradient(160deg,#14B8A6,#4F46E5)"><div class="wave">${Array.from({length:22},(_, k)=>`<i style="height:${20+Math.abs(Math.sin(k))*60}px"></i>`).join('')}</div></div>`;
 else body=`<div class="view" style="background:${c};display:block;padding:30px;font-size:16px"><b style="color:#fff;font-size:20px">${i.n}</b><div class="lines"><i></i><i style="width:85%"></i><i></i><i style="width:60%"></i><i></i><i style="width:75%"></i></div></div>`;
 return `<div class="top"><button class="ib" onclick="ST.v='main';go()">←</button><h1 style="font-size:17px" class="nm">${i.n}</h1><button class="ib" onclick="act(${i.id})">⋮</button></div>${body}
 <div class="mt" style="text-align:center;margin-bottom:14px">${meta(i)}</div><div style="display:flex;gap:10px"><button class="btn g" onclick="dl(${i.id})">⬇ Download</button><button class="btn g" onclick="sheet('share',${i.id})">👥 Share</button></div>`}};
